<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>settings</title>
    <link rel="stylesheet" href="../cool.css?v=global-font-2">
    <link rel="stylesheet" href="../app/modal.css">
    <link rel="stylesheet" href="settings.css">
    <script src="https://kit.fontawesome.com/290c5a7a5b.js" crossorigin="anonymous"></script>
    <script>
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
</head>
<body>
    <button id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i></button>
    <a href="../app/index.html">go back home</a>
    <h1>settings</h1>
    <img src="../static/freg-fix.png" alt="">
    <h3>rss settings</h3>
    <div>
        <label>display rss feed title</label>
        <input type="checkbox">
    </div>
    <h3>my feeds</h3>
    <p id="feed-editor-status" aria-live="polite" role="status"></p>
    <div id="feed-editor-list"></div>
    <h3>customising</h3>
    <div>
        <label>custom feed css</label>
        <textarea placeholder="blah blah..."></textarea>
    </div>
    <div>
        <label for="">choose your font..!</label>
        <select id="fontDropdown">
            <option class="augiepixel" value="Pixel">augiepixel (default)</option>
            <option class="arial" value="Arial, sans-serif">arial</option>
            <option class="georgia" value="Georgia, serif">georgia</option>
            <option class="cursive" value="cursive">cursive</option>
            <option class="opendyslexic" value="OpenDyslexic">OpenDyslexic</option>
        </select>
    </div>
    <h3>~account settings~</h3>
    <p>Signed in as <span id="signed-in-email">Checking...</span></p>
    <button id="logout-btn" hidden>Log out</button>
    <p id="account-message" role="status"></p>
    <div>
        <label for="">
            <input type="checkbox" id="holiday-effects-toggle">
            opt in to holiday mode?
        </label><br>
        <button id="export-feeds">export feeds</button>
        <button id="import-feeds">import feeds</button>
        <input type="file" id="import-feeds-file" accept=".json,application/json" hidden>
        <p id="feed-transfer-status" role="status" aria-live="polite"></p>
    </div>
    <form id="change-email-form">
        <label for="new-email">new email address</label>
        <input type="email" id="new-email" autocomplete="email" required>
        <button type="submit">send verification link</button>
    </form>
    <p id="email-change-message" role="status" aria-live="polite"></p>
    <div class="danger-zone">
        <h3>DANGER ZONE!!!</h3>
        <img src="../static/freg-warning.png"><br>
        <button id="del-open">delete account</button>
    </div>
    <dialog id="delete-account-modal">
        <h1>delete account?</h1>
        <button id="enableBtn1">you're sure???</button>
        <button id="enableBtn2" disabled>like really sure</button>
        <button id="enableBtn3" disabled>you really wanna do this?</button>
        <button id="enableBtn4" disabled>fine</button>
        <button id="deleteAcctBtn" disabled>yes, delete account</button>
        <button id="del-close">close</button>
    </dialog>
    <footer>
        <div id="deployment-info">Loading version info...</div>
    </footer>
    <script src="../build-info.js"></script>
    <script src="../prefrences.js?v=global-font-2"></script>
    <script type="module" src="../backend/fetch-email.js"></script>
    <script>
        const delmodal = document.getElementById('delete-account-modal');
        const openBtnDel = document.getElementById('del-open');
        const closeBtnDel = document.getElementById('del-close');

        openBtnDel.addEventListener('click', () => {
            delmodal.showModal();
        });

        closeBtnDel.addEventListener('click', () => {
            delmodal.close();
        });
    </script>
    <script type="module" src="../backend/exportimport.js"></script>
    <script src="../backend/areyousure.js"></script>
    <script src="../backend/deleteacct.js"></script>
    <script src="../backend/holiday-effects.js"></script>
    <script type="module" src="../backend/change-email.js">// changing emails i see</script>
</body>
</html>
