<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width='device-width', initial-scale=1.0">
    <title>sign in</title>
    <link rel="stylesheet" href="../cool.css?v=global-font-2">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/290c5a7a5b.js" crossorigin="anonymous"></script>
    <script>
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
</head>
<body>
    <button id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i></button>
    <a href="../index.html">oops why am i here go back</a>
    <div class="auth-container">
        <h2>sign in/up!</h2>
        <form id="authForm">
            <label for="email">email address</label>
            <input type="email" id="email" placeholder="enter your email" required>
            <button type="submit" id="submitBtn">send sign in link</button>
        </form>
        <p id="message" class="message"></p>
    </div>
    <footer>
        <div id="deployment-info">Loading version info...</div>
    </footer>
    <script src="../build-info.js"></script>
    <script src="../prefrences.js?v=global-font-2"></script>
    <script type="module" src="../backend/magiclink.js"></script>
    <script src="../backend/holiday-effects.js"></script>
</body>
</html>
